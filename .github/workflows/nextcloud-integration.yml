name: Nextcloud integration tests

on:
  workflow_run:
    workflows: ["Unit tests"]
    types: [completed]

permissions:
  contents: read

jobs:
  nextcloud-versions:
    if: github.event.workflow_run.conclusion == 'success'
    name: Discover Nextcloud releases
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        name: Build stable and pre-release matrix
        shell: bash
        run: |
          set -euo pipefail

          stable="$(curl --fail --retry 3 --retry-delay 2 --silent --show-error https://endoflife.date/api/nextcloud.json | jq --compact-output --arg today "$(date -u +%F)" '[.[] | select(.eol == false or .eol >= $today) | .cycle | select(test("^[0-9]+$")) | select(tonumber >= 33) | {label: ., image: ("nextcloud:" + . + "-apache")} ] | sort_by(.label | tonumber)')"

          # Docker Hub's generic beta tag is historical and unsuitable. Discover the
          # newest explicit release-candidate or beta Apache tag instead, e.g.
          # 35.0.0RC1-apache. If no pre-release image is published, test only stable
          # releases rather than silently using an unrelated legacy image.
          prerelease="$(curl --fail --retry 3 --retry-delay 2 --silent --show-error 'https://hub.docker.com/v2/repositories/library/nextcloud/tags?ordering=last_updated&page_size=100' | jq --compact-output '[.results[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+((RC|rc)[0-9]+|(beta|Beta)[0-9]+)-apache$")) | {label: ("pre-release " + .name), image: ("nextcloud:" + .name)}] | first // empty')"

          if [[ -n "$prerelease" && "$prerelease" != "null" ]]; then
            matrix="$(jq --compact-output --argjson prerelease "$prerelease" '. + [$prerelease]' <<< "$stable")"
          else
            matrix="$stable"
            echo "No current Nextcloud RC/beta Apache image found; testing stable majors only."
          fi

          if [[ "$matrix" == "[]" ]]; then echo "No supported Nextcloud versions were returned." >&2; exit 1; fi
          echo "Testing Nextcloud matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  integration:
    name: Nextcloud ${{ matrix.target.label }}
    needs: nextcloud-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.nextcloud-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Start Nextcloud
        run: docker run --detach --name nextcloud-under-test --publish 8080:80 --volume "$GITHUB_WORKSPACE:/var/www/html/custom_apps/saml_provider:ro" "${{ matrix.target.image }}"
      - name: Run integration smoke test
        env:
          NEXTCLOUD_CONTAINER: nextcloud-under-test
          NEXTCLOUD_URL: http://127.0.0.1:8080
          NEXTCLOUD_VERSION: ${{ matrix.target.label }}
        run: bash tests/Integration/smoke.sh
      - name: Show Nextcloud logs on failure
        if: failure()
        run: docker logs nextcloud-under-test
      - name: Stop Nextcloud
        if: always()
        run: docker rm --force nextcloud-under-test || true
