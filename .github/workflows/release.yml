name: Release app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact semantic version to release, for example 0.8.6'
        required: true
        type: string
      min_nextcloud:
        description: 'Lowest Nextcloud major proven by the reviewed CI matrix'
        required: true
        default: '33'
        type: string
      max_nextcloud:
        description: 'Highest Nextcloud major proven by the reviewed CI matrix'
        required: true
        default: '34'
        type: string
      release_notes:
        description: 'Specific, user-visible Markdown release notes (not boilerplate)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  release:
    # The protected release environment is the approval gate. This workflow never
    # starts from a push or from workflow_run, and it releases only the selected ref.
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Validate manual release inputs
        env:
          VERSION: ${{ inputs.version }}
          MIN_VERSION: ${{ inputs.min_nextcloud }}
          MAX_VERSION: ${{ inputs.max_nextcloud }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Version must be semantic x.y.z.' >&2; exit 1; }
          [[ "$MIN_VERSION" =~ ^[0-9]+$ && "$MAX_VERSION" =~ ^[0-9]+$ ]] || { echo 'Nextcloud versions must be majors.' >&2; exit 1; }
          (( MIN_VERSION <= MAX_VERSION )) || { echo 'Minimum version exceeds maximum version.' >&2; exit 1; }
          [[ -n "${NOTES//[[:space:]]/}" ]] || { echo 'Release notes must be specific.' >&2; exit 1; }
          [[ "$(git branch --show-current)" == 'main' ]] || { echo 'Releases must run from main.' >&2; exit 1; }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, openssl, pdo_sqlite
          coverage: none
      - name: Prepare reviewed metadata and changelog
        env:
          VERSION: ${{ inputs.version }}
          MIN_VERSION: ${{ inputs.min_nextcloud }}
          MAX_VERSION: ${{ inputs.max_nextcloud }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: php scripts/prepare-release.php "$VERSION" "$MIN_VERSION" "$MAX_VERSION"
      - name: Commit and tag manual release
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appinfo/info.xml CHANGELOG.md README.md
          git diff --cached --quiet && { echo 'Release produced no metadata changes.' >&2; exit 1; }
          git commit -m "Release v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin HEAD:main --follow-tags
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create signed runtime-only archive
        env:
          NEXTCLOUD_SIGNING_PRIVATE_KEY: ${{ secrets.NEXTCLOUD_SIGNING_PRIVATE_KEY }}
          NEXTCLOUD_SIGNING_CERTIFICATE: ${{ secrets.NEXTCLOUD_SIGNING_CERTIFICATE }}
          NEXTCLOUD_VERSION: ${{ inputs.max_nextcloud }}
        run: |
          set -euo pipefail
          umask 077
          secrets_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/saml-provider-signing.XXXXXX")"
          trap 'rm -rf "$secrets_dir"' EXIT
          printf '%s' "$NEXTCLOUD_SIGNING_PRIVATE_KEY" > "$secrets_dir/signing.key"
          printf '%s' "$NEXTCLOUD_SIGNING_CERTIFICATE" > "$secrets_dir/signing.crt"
          scripts/create-appstore-package.sh build/release
          docker run --rm --entrypoint php --volume "$PWD/build/release:/release" --volume "$secrets_dir:/secrets:ro" "nextcloud:${NEXTCLOUD_VERSION}-apache" /usr/src/nextcloud/occ integrity:sign-app --privateKey=/secrets/signing.key --certificate=/secrets/signing.crt --path=/release/saml_provider
          scripts/verify-appstore-package.sh build/release/saml_provider
          tar -C build/release -czf build/saml_provider.tar.gz saml_provider
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release create "v${VERSION}" build/saml_provider.tar.gz --title "v${VERSION}" --generate-notes
