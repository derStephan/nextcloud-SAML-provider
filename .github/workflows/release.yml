name: Release app
on:
  workflow_run:
    workflows: ["Kimai SAML end-to-end test"]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: app-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Confirm current main commit
        id: current
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$HEAD_SHA" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Discover tested stable Nextcloud range
        if: steps.current.outputs.current == 'true'
        id: compatibility
        run: |
          set -euo pipefail
          stable="$(curl --fail --retry 3 --retry-delay 2 --silent --show-error https://endoflife.date/api/nextcloud.json | jq --compact-output --arg today "$(date -u +%F)" '[.[] | select(.eol == false or .eol >= $today) | .cycle | select(test("^[0-9]+$")) | select(tonumber >= 33) | tonumber] | sort')"
          min="$(jq 'first' <<< "$stable")"; max="$(jq 'last' <<< "$stable")"
          [[ "$min" != "null" && "$max" != "null" ]]
          echo "min=$min" >> "$GITHUB_OUTPUT"; echo "max=$max" >> "$GITHUB_OUTPUT"
      - name: Decide scheduled-release need
        if: steps.current.outputs.current == 'true'
        id: decision
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          MIN_VERSION: ${{ steps.compatibility.outputs.min }}
          MAX_VERSION: ${{ steps.compatibility.outputs.max }}
        run: |
          set -euo pipefail
          current_range="$(sed -n 's/.*<nextcloud min-version="\([0-9]*\)"\( max-version="\([0-9]*\)"\)\{0,1\}\/.*/\1 \3/p' appinfo/info.xml)"
          if [[ "$EVENT" == "schedule" && "$current_range" == "$MIN_VERSION $MAX_VERSION" ]]; then echo "release=false" >> "$GITHUB_OUTPUT"; else echo "release=true" >> "$GITHUB_OUTPUT"; fi
      - name: Import tested admin screenshots
        if: steps.current.outputs.current == 'true' && steps.decision.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          E2E_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          echo "Importing admin screenshots only from successful Kimai E2E run ${E2E_RUN_ID}."
          artifact_urls="$(gh api --paginate "repos/${REPOSITORY}/actions/runs/${E2E_RUN_ID}/artifacts?per_page=100"             --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("kimai-saml-admin-screenshot-")) | .archive_download_url')"
          [[ -n "$artifact_urls" ]] || { echo "No current admin screenshot artifacts were produced by E2E run ${E2E_RUN_ID}. Refusing to release stale documentation." >&2; exit 1; }
          temp="$(mktemp -d)"; trap 'rm -rf "$temp"' EXIT
          count=0
          while IFS= read -r artifact_url; do
            archive="$temp/$count.zip"
            gh api "$artifact_url" > "$archive"
            unzip -q "$archive" -d "$temp/extract-$count"
            count=$((count + 1))
          done <<< "$artifact_urls"
          mkdir -p docs
          mapfile -t screenshots < <(find "$temp" -type f -regextype posix-extended -regex '.*/admin-settings-e2e-nc[A-Za-z0-9._-]+\.png' | sort)
          [[ ${#screenshots[@]} -gt 0 ]] || { echo "E2E artifacts did not contain target-named admin screenshots. Refusing to release." >&2; exit 1; }
          for screenshot in "${screenshots[@]}"; do
            filename="$(basename "$screenshot")"
            python3 - "$screenshot" <<'PYTHON'
          from PIL import Image
          import sys
          with Image.open(sys.argv[1]) as image:
              image.verify()
          PYTHON
            cp "$screenshot" "docs/$filename"
            echo "Imported tested screenshot: docs/$filename"
          done
          expected="$(gh api --paginate "repos/${REPOSITORY}/actions/runs/${E2E_RUN_ID}/jobs?per_page=100" --jq '[.jobs[] | select(.name | startswith("Nextcloud ")) | select(.conclusion == "success")] | length')"
          [[ "$expected" =~ ^[1-9][0-9]*$ ]] || { echo "Could not determine successful E2E matrix jobs." >&2; exit 1; }
          [[ ${#screenshots[@]} -eq $expected ]] || { echo "Expected ${expected} E2E screenshots, imported ${#screenshots[@]}. Refusing incomplete documentation release." >&2; exit 1; }
          echo "Imported ${#screenshots[@]} validated screenshots from E2E run ${E2E_RUN_ID}."
      - uses: shivammathur/setup-php@v2
        if: steps.current.outputs.current == 'true' && steps.decision.outputs.release == 'true'
        with:
          php-version: '8.3'
          extensions: dom, openssl, pdo_sqlite
          coverage: none
      - name: Prepare metadata, commit, and tag
        if: steps.current.outputs.current == 'true' && steps.decision.outputs.release == 'true'
        id: version
        env:
          MIN_VERSION: ${{ steps.compatibility.outputs.min }}
          MAX_VERSION: ${{ steps.compatibility.outputs.max }}
          RELEASE_REASON: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          php scripts/prepare-release.php "$MIN_VERSION" "$MAX_VERSION" "$RELEASE_REASON"
          version="$(cat release-version.txt)"; echo "number=$version" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appinfo/info.xml CHANGELOG.md README.md docs/admin-settings-e2e-nc*.png; git commit -m "Release v${version}"; git tag -a "v${version}" -m "Release v${version}"; git push origin HEAD:main --follow-tags
      - name: Create signed archive
        if: steps.current.outputs.current == 'true' && steps.decision.outputs.release == 'true'
        env:
          NEXTCLOUD_SIGNING_PRIVATE_KEY: ${{ secrets.NEXTCLOUD_SIGNING_PRIVATE_KEY }}
          NEXTCLOUD_SIGNING_CERTIFICATE: ${{ secrets.NEXTCLOUD_SIGNING_CERTIFICATE }}
          NEXTCLOUD_VERSION: ${{ steps.compatibility.outputs.max }}
        run: |
          set -euo pipefail; umask 077
          printf '%s' "$NEXTCLOUD_SIGNING_PRIVATE_KEY" > signing.key; printf '%s' "$NEXTCLOUD_SIGNING_CERTIFICATE" > signing.crt
          mkdir -p build/release/saml_provider; git archive --format=tar HEAD | tar -x -C build/release/saml_provider
          # /var/www/html is a Docker volume and is empty before the image entrypoint initializes it.
          # The unmodified Nextcloud source, including occ, is always available at /usr/src/nextcloud.
          docker run --rm --entrypoint php --volume "$PWD/build/release:/release" --volume "$PWD/signing.key:/secrets/signing.key:ro" --volume "$PWD/signing.crt:/secrets/signing.crt:ro" "nextcloud:${NEXTCLOUD_VERSION}-apache" /usr/src/nextcloud/occ integrity:sign-app --privateKey=/secrets/signing.key --certificate=/secrets/signing.crt --path=/release/saml_provider
          test -f build/release/saml_provider/appinfo/signature.json; tar -C build/release -czf build/saml_provider.tar.gz saml_provider; rm -f signing.key signing.crt
      - name: Create GitHub Release
        if: steps.current.outputs.current == 'true' && steps.decision.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}
        run: gh release create "v${VERSION}" build/saml_provider.tar.gz --title "v${VERSION}" --generate-notes
      # Safe by default: a GitHub Release is created, but the App Store is only updated
      # when the repository variable PUBLISH_TO_APPSTORE is explicitly set to true.
      - name: Publish to Nextcloud App Store
        if: steps.current.outputs.current == 'true' && steps.decision.outputs.release == 'true' && vars.PUBLISH_TO_APPSTORE == 'true'
        uses: R0Wi/nextcloud-appstore-push-action@a011fe619bcf6e77ddebc96f9908e1af4071b9c1
        with:
          app_name: saml_provider
          appstore_token: ${{ secrets.NEXTCLOUD_APPSTORE_TOKEN }}
          download_url: https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.number }}/saml_provider.tar.gz
          app_private_key: ${{ secrets.NEXTCLOUD_SIGNING_PRIVATE_KEY }}
          nightly: false
      - name: Remove signing material
        if: always()
        run: rm -f signing.key signing.crt
