name: Unit tests

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Deliberately repository-controlled. Update through a reviewed pull request,
        # rather than allowing an external lifecycle API to redefine release evidence.
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, openssl
          coverage: xdebug
      - name: Public API preflight
        run: bash tests/Integration/public-api-preflight.sh
      - name: Verify repository and release hygiene
        run: bash tests/Integration/release-hygiene.sh
      - name: Verify UI translation catalogs
        run: python3 tests/Integration/check-localization.py
      - name: Verify unit-test integrity
        run: python3 tests/Integration/check-test-suite-integrity.py
      - run: composer install --no-interaction --prefer-dist
      - run: composer test:coverage
      - name: Upload coverage report
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/clover.xml
          fail_ci_if_error: false
          verbose: true
